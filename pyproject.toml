[tool.pytest.ini_options]
addopts = """
--alluredir=allure-results
--strict-markers
"""

testpaths = ["tests"]

markers = [
    "api: API tests",
    "regression: Regression suite",
    "authorization: Authorization tests",
    "registration: Registration tests"
]

log_cli = true
log_cli_level = "INFO"


[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.pytest_cache
  | allure-results
  | allure-report
)/
'''


[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "allure-results",
    "allure-report"
]


[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
]

ignore = [
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
